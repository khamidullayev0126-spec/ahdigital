# Render.com uchun sozlama (Blueprint). Render bu faylni o'qib, saytni o'zi sozlaydi.
services:
  - type: web
    name: ahdigital
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
