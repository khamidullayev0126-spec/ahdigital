<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin · AHdigital</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a href="/" class="brand"><img src="/images/logo.svg" class="brand-logo" alt="" width="40" height="40">AHdigital</a>
    <div class="nav-links">
      <a href="/">Saytga qaytish</a>
      <button class="btn btn-secondary" id="logout-btn" hidden>Chiqish</button>
    </div>
  </nav>

  <!-- Kirish oynasi -->
  <section id="login-box">
    <form id="login-form" class="order-form admin-login">
      <h2 class="section-title">Admin panel</h2>
      <div class="field">
        <label for="password">Parol</label>
        <input class="input" id="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Kirish</button>
      <p class="form-status" id="login-status" role="status"></p>
    </form>
  </section>

  <!-- Buyurtmalar -->
  <section id="orders-box" hidden>
    <h2 class="section-title">Buyurtmalar</h2>
    <div class="stats" id="stats"></div>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr><th>Sana</th><th>Ism</th><th>Aloqa</th><th>Xizmat</th><th>Izoh</th><th>Holat</th><th></th></tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
    <p class="section-lead" id="empty" hidden>Hozircha buyurtma yo'q.</p>
  </section>
</div>
<script src="admin.js"></script>
</body>
</html>
